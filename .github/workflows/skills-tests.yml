name: Skills Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint & Test Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint & Test Skills
        run: bin/lint-skills.sh

      - name: Test The Linter
        run: bash skills/tests/lint-skills.test.sh

      - name: Verify AGENTS.md Matches rules/
        run: bin/build-agents.sh --check
